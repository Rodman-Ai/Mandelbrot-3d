name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/mandelbrot-3d-game-1cGKf]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Copy site files to a temp dir
          mkdir -p /tmp/site
          cp index.html styles.css game.js README.md /tmp/site/
          # Switch to (or create) gh-pages branch
          git fetch origin gh-pages 2>/dev/null || true
          git checkout --orphan gh-pages-deploy
          git rm -rf . --quiet
          cp /tmp/site/* .
          git add index.html styles.css game.js README.md
          git commit -m "Deploy to GitHub Pages [skip ci]"
          git push origin HEAD:gh-pages --force
